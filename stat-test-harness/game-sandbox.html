<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authorized Game Adapter Lab v6</title>
<style>
body{margin:0;background:#0c1117;color:#eef3f8;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{padding:18px}
button{padding:10px 14px;border:1px solid #45607c;border-radius:9px;background:#28538d;color:white;font-weight:800;cursor:pointer}.pill{display:inline-block;padding:5px 9px;border:1px solid #344354;border-radius:999px}
pre{white-space:pre-wrap;word-break:break-word;background:#080c11;border:1px solid #27313d;border-radius:9px;padding:12px;min-height:70px}
</style>
</head>
<body>
<div class="wrap">
  <h2>Authorized Game/Test Build Adapter</h2>
  <p><span class="pill" id="authLabel">NOT AUTHENTICATED</span></p>
  <button id="authenticate">Authenticate test player</button>
  <button id="signOut">Sign out test player</button>
  <h3>Player</h3><pre id="playerOut">—</pre>
  <h3>Current stats</h3><pre id="statsOut">Unavailable before authentication.</pre>
  <h3>Applied modifiers</h3><pre id="flagsOut">Unavailable before authentication.</pre>
</div>

<script src="./core.js"></script>
<script src="./bridge-engine.js"></script>
<script>
"use strict";
const engine=HHBridgeEngine.createBridgeEngine(HHCore,{...HHCore.DEFAULTS});
let authenticated=false;
const player={id:"test-player-001",username:"authorized_test_player"};

window.HelmetHeroesTestHost={
  allowedParentOrigins:[location.origin],

  async getAuthenticatedPlayer(){
    return {authenticated,player:authenticated?player:null};
  },

  async getCapabilities(){
    return authenticated
      ? ["read-player-stats","apply-test-modifiers","restore-player-stats"]
      : [];
  },

  async getPlayerStats(){
    if(!authenticated)throw new Error("Authentication required");
    return engine.getOriginalStats();
  },

  async setTestModifiers(flags){
    if(!authenticated)throw new Error("Authentication required");
    const result=engine.setModifiers(flags);render();return result;
  },

  async restorePlayerStats(){
    if(!authenticated)throw new Error("Authentication required");
    const result=engine.restore();render();return {stats:result.stats};
  }
};

function render(){
  document.getElementById("authLabel").textContent=authenticated?"AUTHENTICATED":"NOT AUTHENTICATED";
  document.getElementById("playerOut").textContent=authenticated?JSON.stringify(player,null,2):"—";
  document.getElementById("statsOut").textContent=authenticated?JSON.stringify(engine.getStats(),null,2):"Unavailable before authentication.";
  document.getElementById("flagsOut").textContent=authenticated?JSON.stringify(engine.getApplied(),null,2):"Unavailable before authentication.";
}
document.getElementById("authenticate").addEventListener("click",()=>{authenticated=true;render()});
document.getElementById("signOut").addEventListener("click",()=>{authenticated=false;engine.restore();render()});
render();
</script>
<script src="./game-test-bridge.js"></script>
</body>
</html>
